<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AQUANEX | Login</title>

    <!-- Authentication CSS -->
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            🌊 AQUA<span>NEX</span>
        </div>

        <a href="../index.html" class="home-link">
            🏠 Home
        </a>

    </header>


    <!-- ================= LOGIN CONTAINER ================= -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🌊
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to your AQUANEX account
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                        minlength="6">

                </div>


                <div class="remember-row">

                    <label>
                        <input
                            type="checkbox"
                            id="rememberMe">

                        Remember me
                    </label>

                    <a href="#" onclick="forgotPassword()">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>


            <div id="loginMessage"
                 class="message">
            </div>


            <!-- REGISTER LINK -->

            <p class="switch-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            🌊 AQUANEX - Water Logging Prediction System
        </p>

        <p>
            Predict • Monitor • Alert • Protect
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="../js/auth.js"></script>

</body>

</html>
